name: Deploy

on:
  push:
    branches:
      - main
      - staging
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ENVIRONMENT: production

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r .next deploy-package/
          cp -r public deploy-package/ || true
          cp package.json deploy-package/
          cp pnpm-lock.yaml deploy-package/
          cp next.config.ts deploy-package/ || true
          tar -czf deploy.tar.gz -C deploy-package .

      - name: Deploy to Production Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          APP_DIR: /home/${{ secrets.SERVER_USER }}/mum-mentor-fe
          APP_PORT: 3000
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no deploy.tar.gz ${SERVER_USER}@${SERVER_HOST}:/tmp/deploy.tar.gz

          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} << 'ENDSSH'
            set -e
            echo "Starting PRODUCTION deployment..."
            
            mkdir -p ~/mum-mentor-fe
            tar -xzf /tmp/deploy.tar.gz -C ~/mum-mentor-fe/
            rm /tmp/deploy.tar.gz

            cd ~/mum-mentor-fe
            pnpm install --prod --frozen-lockfile --ignore-scripts

            cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [{
              name: 'mum-mentor-fe',
              script: 'node_modules/next/dist/bin/next',
              args: 'start -p 3000',
              cwd: process.env.HOME + '/mum-mentor-fe',
              instances: 1,
              autorestart: true,
              watch: false,
              max_memory_restart: '1G',
              env: {
                NODE_ENV: 'production',
                PORT: 3000
              },
              error_file: process.env.HOME + '/mum-mentor-fe/logs/error.log',
              out_file: process.env.HOME + '/mum-mentor-fe/logs/out.log',
              log_date_format: 'YYYY-MM-DD HH:mm:ss Z'
            }]
          };
          EOF

            mkdir -p ~/mum-mentor-fe/logs
            pm2 stop mum-mentor-fe || true
            pm2 delete mum-mentor-fe || true
            pm2 start ecosystem.config.js
            pm2 save

            sleep 5
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Production deployment successful!"
            else
              echo "❌ Health check failed!"
              exit 1
            fi
            
            pm2 status
          ENDSSH

          echo "Production deployment completed!"

  deploy-staging:
    name: Deploy to Staging
    runs-on: self-hosted
    environment: staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ENVIRONMENT: staging

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r .next deploy-package/
          cp -r public deploy-package/ || true
          cp package.json deploy-package/
          cp pnpm-lock.yaml deploy-package/
          cp next.config.ts deploy-package/ || true
          tar -czf deploy.tar.gz -C deploy-package .

      - name: Deploy to Staging Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          APP_DIR: /home/${{ secrets.SERVER_USER }}/mum-mentor-fe-staging
          APP_PORT: 3001
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no deploy.tar.gz ${SERVER_USER}@${SERVER_HOST}:/tmp/deploy-staging.tar.gz

          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} << 'ENDSSH'
            set -e
            echo "Starting STAGING deployment..."
            
            mkdir -p ~/mum-mentor-fe-staging
            tar -xzf /tmp/deploy-staging.tar.gz -C ~/mum-mentor-fe-staging/
            rm /tmp/deploy-staging.tar.gz

            cd ~/mum-mentor-fe-staging
            pnpm install --prod --frozen-lockfile --ignore-scripts

            cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [{
              name: 'mum-mentor-fe-staging',
              script: 'node_modules/next/dist/bin/next',
              args: 'start -p 3001',
              cwd: process.env.HOME + '/mum-mentor-fe-staging',
              instances: 1,
              autorestart: true,
              watch: false,
              max_memory_restart: '1G',
              env: {
                NODE_ENV: 'production',
                PORT: 3001
              },
              error_file: process.env.HOME + '/mum-mentor-fe-staging/logs/error.log',
              out_file: process.env.HOME + '/mum-mentor-fe-staging/logs/out.log',
              log_date_format: 'YYYY-MM-DD HH:mm:ss Z'
            }]
          };
          EOF

            mkdir -p ~/mum-mentor-fe-staging/logs
            pm2 stop mum-mentor-fe-staging || true
            pm2 delete mum-mentor-fe-staging || true
            pm2 start ecosystem.config.js
            pm2 save

            sleep 5
            if curl -f http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Staging deployment successful!"
            else
              echo "❌ Health check failed!"
              exit 1
            fi
            
            pm2 status
          ENDSSH

          echo "Staging deployment completed!"
