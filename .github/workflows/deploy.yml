name: Deploy

on:
  push:
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to EC2 Server
    runs-on: [self-hosted, hng-13-runner]
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r .next deploy-package/
          cp -r public deploy-package/ || true
          cp package.json deploy-package/
          cp pnpm-lock.yaml deploy-package/
          cp -r scripts deploy-package/ || true
          cp next.config.ts deploy-package/ || true
          tar -czf deploy.tar.gz -C deploy-package .
      - name: Deploy to Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          APP_DIR: /home/${{ secrets.SERVER_USER }}/mum-mentor-fe
          APP_PORT: 3000
        run: |
          # Install sshpass for password-based authentication
          sudo apt-get update
          sudo apt-get install -y sshpass

          # Add server to known hosts
          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

          # Copy deployment package to server using password authentication
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no deploy.tar.gz ${SERVER_USER}@${SERVER_HOST}:/tmp/deploy.tar.gz

          # Execute deployment on server using password authentication
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} << 'ENDSSH'
            set -e

            echo "Starting deployment process..."
            # Create application directory if it doesn't exist
            mkdir -p ~/mum-mentor-fe

            # Backup current deployment
            BACKUP_DIR="/home/$USER/mum-mentor-fe-backup-$(date +%Y%m%d-%H%M%S)"
            if [ -d "~/mum-mentor-fe" ]; then
              echo "Creating backup..."
              cp -r ~/mum-mentor-fe "$BACKUP_DIR"
            fi

            # Extract deployment package
            echo "Extracting deployment package..."
            mkdir -p ~/mum-mentor-fe
            tar -xzf /tmp/deploy.tar.gz -C ~/mum-mentor-fe/
            rm /tmp/deploy.tar.gz

            # Navigate to application directory
            cd ~/mum-mentor-fe

            # Install production dependencies
            echo "Installing production dependencies..."
            pnpm install --prod --frozen-lockfile --ignore-scripts

            # Configure nginx
          #   echo "Configuring nginx..."
          #   sudo tee /etc/nginx/sites-available/mum-mentor > /dev/null << 'EOF'
          # server {
          #     listen 80;
          #     listen [::]:80;
          #     server_name _;

          #     # Backend API routes - proxy to port 8000
          #     location /api {
          #         proxy_pass http://localhost:8000;
          #         proxy_http_version 1.1;
          #         proxy_set_header Host $host;
          #         proxy_set_header X-Real-IP $remote_addr;
          #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          #         proxy_set_header X-Forwarded-Proto $scheme;
          #     }

          #     # API documentation - proxy to port 8000
          #     location /docs {
          #         proxy_pass http://localhost:8000;
          #         proxy_http_version 1.1;
          #         proxy_set_header Host $host;
          #         proxy_set_header X-Real-IP $remote_addr;
          #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          #         proxy_set_header X-Forwarded-Proto $scheme;
          #     }

          #     # OpenAPI schema - proxy to port 8000
          #     location /openapi.json {
          #         proxy_pass http://localhost:8000;
          #         proxy_http_version 1.1;
          #         proxy_set_header Host $host;
          #         proxy_set_header X-Real-IP $remote_addr;
          #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          #         proxy_set_header X-Forwarded-Proto $scheme;
          #     }

          #     # Frontend - proxy to port 3000 (Next.js)
          #     location / {
          #         proxy_pass http://localhost:3000;
          #         proxy_http_version 1.1;
          #         proxy_set_header Upgrade $http_upgrade;
          #         proxy_set_header Connection 'upgrade';
          #         proxy_set_header Host $host;
          #         proxy_set_header X-Real-IP $remote_addr;
          #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          #         proxy_set_header X-Forwarded-Proto $scheme;
          #         proxy_cache_bypass $http_upgrade;
          #     }

          #     # Next.js static files optimization
          #     location /_next/static {
          #         proxy_pass http://localhost:3000;
          #         proxy_cache_valid 60m;
          #         add_header Cache-Control "public, immutable";
          #     }
          # }
          # EOF

            # Enable nginx site
            # sudo ln -sf /etc/nginx/sites-available/mum-mentor /etc/nginx/sites-enabled/
            # sudo rm -f /etc/nginx/sites-enabled/default

            # Test nginx configuration
            # sudo nginx -t

            # Reload nginx
            # sudo systemctl reload nginx
            # sudo systemctl enable nginx

            # Create PM2 ecosystem file
            cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [{
              name: 'mum-mentor-fe',
              script: 'node_modules/next/dist/bin/next',
              args: 'start -p 3000',
              cwd: process.env.HOME + '/mum-mentor-fe',
              instances: 1,
              autorestart: true,
              watch: false,
              max_memory_restart: '1G',
              env: {
                NODE_ENV: 'production',
                PORT: 3000
              },
              error_file: process.env.HOME + '/mum-mentor-fe/logs/error.log',
              out_file: process.env.HOME + '/mum-mentor-fe/logs/out.log',
              log_date_format: 'YYYY-MM-DD HH:mm:ss Z'
            }]
          };
          EOF

            # Create logs directory
            mkdir -p ~/mum-mentor-fe/logs

            # Stop existing PM2 process if running
            pm2 stop mum-mentor-fe || true
            pm2 delete mum-mentor-fe || true

            # Start application with PM2
            echo "Starting application with PM2..."
            pm2 start ecosystem.config.js

            # Save PM2 process list
            pm2 save

            # Setup PM2 to start on system boot
            # sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u $USER --hp $HOME || true

            # Health check with rollback
            echo "Performing health check..."
            sleep 10
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              # Clean up old backups (keep last 3)
              ls -dt /home/$USER/mum-mentor-fe-backup-* | tail -n +4 | xargs rm -rf || true
            else
              echo "❌ Health check failed, rolling back..."
              if [ -d "$BACKUP_DIR" ]; then
                rm -rf ~/mum-mentor-fe
                mv "$BACKUP_DIR" ~/mum-mentor-fe
                cd ~/mum-mentor-fe
                pm2 startOrRestart ecosystem.config.js
              fi
              exit 1
            fi

            echo "Application is running on port 3000"
            echo "Nginx is proxying requests from port 80 to port 3000"
            pm2 status
          ENDSSH

          echo "Deployment to EC2 server completed successfully!"
